<p-toast></p-toast>
<p-confirmdialog></p-confirmdialog>
<div class="w-[50%] bg-[var(--button-fourth)] p-8">

  <!-- Header -->
<div class="flex flex-col md:flex-row md:items-center gap-6 mb-3">

  <div class="relative w-[140px] h-[140px]">

    <img
    [src]="previewImage || userData().photo || 'https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png'"
    class="w-full h-full rounded-full object-cover border"
    />

    <!-- PrimeNG button-->
    <div class="absolute bottom-2 right-0">
        <p-fileUpload
      mode="basic"
      chooseIcon="pi pi-cloud-upload"
      chooseLabel=""
      accept="image/*"
      (onSelect)="onFileSelected($event)"
      [auto]="true"
      class="camera-btn"
      [chooseButtonProps]="{
        rounded: true,
        style: {
          backgroundColor: 'var(--button-fourth)',
          color: 'var(--text-primary)',
          border: 'none'
        }
      }"
    ></p-fileUpload>
    </div>

  </div>

  <div>
    <h2 class="text-2xl md:text-3xl font-semibold text-[var(--text-primary)]">
      Upload Photo
    </h2>

    <p class="text-gray-500 text-[13px] text-lg mt-3">
      You can upload JPG, PNG, GIF (max 5MB)
    </p>
  </div>

</div>

  <!-- Form -->
  <form (ngSubmit)="updateProfile()">

    <!-- First + Last Name  -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-3">

      <lib-shared-inp
        label="First name"
        placeholder="Jonathan"
        type="text"
        id="firstName"
        [value]="userData().firstName"
        (valueChange)="tempUser.firstName = $event"
      ></lib-shared-inp>

      <lib-shared-inp
        label="Last name"
        placeholder="Adrian"
        type="text"
        id="lastName"
        [value]="userData().lastName"
        (valueChange)="tempUser.lastName = $event"
      ></lib-shared-inp>

    </div>

    <!-- Email -->
    <div class="mb-3">
      <lib-shared-inp
        label="Email"
        placeholder="jonathan@gmail.com"
        type="email"
        id="email"
        [value]="userData().email"
        (valueChange)="tempUser.email = $event"
      ></lib-shared-inp>
    </div>

    <!-- Phone -->
    <div class="mb-3">

      <lib-shared-phone-inp
      [value]="userData().phone"
      (valueChange)="tempUser.phone = $event"
      ></lib-shared-phone-inp>

    </div>

    <!-- Gender -->
    <div class="mb-3">

      <label class="block mb-3 text-lg font-semibold text-[var(--text-primary)] ">
        Gender
      </label>

      <select
        value="userData().gender"
        class="w-full h-10 !bg-border-primary rounded-xl border !border-gray-400 placeholder:!text-sm placeholder:!text-text-primary  outline-none transition"
      >
        <option class="text-text-primary">Male</option>
        <option class="text-text-primary">Female</option>
      </select>

    </div>

    <!-- Actions -->
    <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-5 mt-3">

      <div class="flex justify-center items-center flex-wrap">
        <button
            type="button"
            class="text-button-primary ms-2 text-sm font-medium hover:underline"
            (click)="confirm2($event)"
          >
            Delete My Account
          </button>

      <button
        type="button"
        class="text-gray-500 ms-2 text-sm font-medium hover:underline"
      >
        Change Password
      </button>
      </div>

      <lib-custom-button
        [label]="'Save Changes'"
        [buttonStyle]="'primary'"
        [buttonType]="'submit'"
      ></lib-custom-button>
    </div>

  </form>

</div>
