<p-menu [model]="menuItems" appendTo="body"
        styleClass="absolute  ml-0 pl-2 border-l-2 border-gray-200 text-sm"
        [style]="{ backgroundColor: 'var(--border-primary)', color: 'var(--header-second-line)' }">

  <ng-template pTemplate="item" let-item>
    <div class="{{item.styleClass}}" (click)="item.command?.()">
      <lucide-icon [img]="item.icon" class="w-5 h-5"></lucide-icon>
      <span class="ml-2">{{ item.label }}</span>
    </div>
  </ng-template>

</p-menu>
