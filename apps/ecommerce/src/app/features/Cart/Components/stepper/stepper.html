<div class="w-full mb-3">
      <div class="relative flex items-center h-10">
        <div class="absolute left-0 top-1/2 h-1 w-full -translate-y-1/2 bg-gray-100 rounded-full"></div>

        <div
          class="absolute left-0 top-1/2 h-1 -translate-y-1/2 bg-button-primary rounded-full transition-all duration-1000 ease-in-out"
          [style.width.%]="calculateWidth()">
        </div>

        @for (step of steps; track $index) {
          <div
             [style.left.%]="step.position"
             class="absolute -translate-x-1/2 top-1/2 -translate-y-1/2 z-10">
          <div class="w-9 h-9 flex items-center justify-center rounded-full font-bold border-4 border-white shadow transition-all duration-500"
               [class]="currentStep >= ($index + 1) ? 'bg-button-primary text-background-primary' : 'bg-gray-200 text-gray-500'">
            {{ $index + 1 }}
          </div>
        </div>
        }

      </div>
    </div>
