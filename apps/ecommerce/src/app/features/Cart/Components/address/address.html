<h2 class="text-2xl font-bold mb-3 text-text-primary">Shipping Address</h2>

<div class="space-y-4">
@for (addr of addresses(); track addr._id) {
<div
  (click)="selectAddress(addr._id)"
  class="relative flex items-center justify-between p-5 py-3 rounded-2xl cursor-pointer transition-all duration-300 group
         flex-col md:flex-row gap-4 md:gap-0 mb-4"
  [class]="selectedAddressId() === addr._id ?
    'bg-button-primary text-background-primary shadow-xl scale-[1.01]' :
    'bg-white border border-gray-100 text-gray-800'">

  <div class="flex-1 w-full md:w-auto">
    <h3 class="text-xl font-bold mb-1">{{ addr.city }}</h3>
    <span class="inline-block px-4 py-1 rounded-full text-[10px] font-medium transition-colors uppercase tracking-wider"
          [class]="selectedAddressId() === addr._id ? 'bg-black/20 text-white' : 'bg-gray-100 text-gray-500'">
      {{ addr.street }}
    </span>
  </div>

  <div class="flex items-center space-x-3 text-sm font-bold w-full md:w-auto justify-between md:justify-end">
    <div class="p-2 rounded-full shadow-sm transition-colors"
         [class]="selectedAddressId() === addr._id ? 'bg-white text-button-primary' : 'bg-red-800 text-white'">
      <lucide-icon [img]="icons[0]" class="w-5 h-5"></lucide-icon>
    </div>
    <span>{{ addr.phone }}</span>
  </div>
</div>
} @empty {
  <div class="text-center p-10 text-gray-400">
    No addresses found. Please add a new one.
  </div>
}
</div>

<div class="relative my-5 text-center">
  <hr class="border-gray-100">
  <span class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white px-6 text-gray-400 font-bold uppercase tracking-[0.2em] text-[10px]">OR</span>
</div>

<lib-custom-button
            (click)="openModal()"
            class="text-bold"
            [buttonStyle]="'second'"
            [label]="'Add a New Address'"
></lib-custom-button>

<div class="flex justify-end pt-4 border-t border-gray-50">
  <lib-custom-button
            [buttonStyle]="'primary'"
            [label]="'Next'"
            [icon]="arrowIcon"
            (click)="goToPayment()"
  ></lib-custom-button>
</div>

<!-- Modal - Exactly matching the image design -->
@if (isModalOpen()) {
<div class="fixed inset-0 z-50 overflow-y-auto bg-black/20 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="max-w-3xl w-full mx-auto p-8 bg-background-primary rounded-[1rem] shadow-2xl font-sans relative" dir="ltr">

    <button (click)="closeModal()" class="absolute top-6 right-6 text-gray-400 hover:text-red-500 transition-colors">
      <lucide-icon [img]="icons[1]" class="w-5 h-5 text-rose-500"></lucide-icon>
    </button>

    <router-outlet></router-outlet>
  </div>
</div>
}
