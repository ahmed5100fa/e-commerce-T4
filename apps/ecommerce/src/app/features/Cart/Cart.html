<section class="w-11/12 mx-auto flex flex-wrap">

  <!-- LEFT -->
  <section class="w-full lg:w-8/12 px-5 py-8">
    <router-outlet></router-outlet>
  </section>

  <!-- RIGHT -->
  <section class="w-full lg:w-4/12">
    <div class="shadow-lg p-6 rounded-xl">
      <app-cart-summary
        [Subtotal]="cartService.totalPrice()"
        [Discount]="0"
        [Total]="cartService.totalPrice()"
        [isDiscount]="false">
      </app-cart-summary>
    </div>
  </section>

  <!-- PRODUCTS -->
  <section class="w-full">
    <app-second-header [text]="'Products You May Like'"></app-second-header>
    <app-carousel [productsNum]="4" [productsInput]="Products"></app-carousel>
  </section>

</section>

@if (loadingService.loading()) {
<div class="fixed inset-0 flex items-center justify-center bg-black/30 z-50">
  <app-spinner></app-spinner>
</div>
}
