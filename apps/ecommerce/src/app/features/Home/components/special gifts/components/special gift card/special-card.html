<div [class]="imgSrc" class="bg-cover bg-center h-full rounded-2xl w-full">
  <div
    class="bg-linear-to-t from-[rgba(0,0,0,0.7)] to-transparent h-full rounded-2xl p-5 flex flex-col justify-end gap-2"
  >
    <!-- label -->
    <span
      class="bg-red-200 text-red-800 text-xs font-medium px-2 py-1 rounded w-fit"
    >
      {{label}}
    </span>

    <p class="text-white font-bold text-2xl">{{text}}</p>
    <ng-content></ng-content>
  </div>
</div>
