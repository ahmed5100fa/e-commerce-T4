<section class="w-11/12 mx-auto">
  <div class="py-5 grid grid-cols-12 gap-3">
    <!-- another card -->
    <div class="hidden lg:block lg:col-span-3">
      <special-card
        [label]="'Staring from 10.99 EGP'"
        [text]="'Special Gifts For The People You Love'"
      >
        <div class="mt-1">
          <lib-custom-button
            [buttonStyle]="'second'"
            [label]="'Shop Now'"
            [icon]="arrowIcon"
          ></lib-custom-button>
        </div>
      </special-card>
    </div>
    <!-- Carousel -->
    <div class="col-span-12 lg:col-span-9">
      <owl-carousel-o [options]="customOptions">
        @for (item of imges; track $index) {
        <ng-template carouselSlide>
          <div class="relative">
            <div
              [class]="imges[$index]"
              class="w-full h-120 bg-center bg-cover rounded-2xl"
            >
              <div
                class="bg-linear-90 from-[rgba(0,0,0,0.7)] to-transparent w-full h-full rounded-2xl p-5 flex flex-col justify-end"
              >
                <div class="texts">
                  <h2 class="text-white font-semibold text-5xl pb-3">
                    {{titles[$index]}}
                  </h2>
                  <p class="text-white text-xl">{{subTitle[$index]}}</p>
                </div>
                <div class="mt-6">
                  <lib-custom-button
                    [buttonStyle]="'second'"
                    [label]="'I’m buying !'"
                  ></lib-custom-button>
                </div>
              </div>
            </div>
          </div>
        </ng-template>
        }
      </owl-carousel-o>
    </div>
  </div>
  <section class="mx-auto flex flex-wrap  py-3 lg:px-0">
  @for (gift of gifts; track $index) {
    <app-special-gifts-card
      [image]="gift.image"
      [title]="gift.title"
      [label]="gift.label"
      class="w-full lg:w-1/3 md:w-1/2 "
    ></app-special-gifts-card>
  }
</section>
</section>
