<section class="w-11/12 mx-auto my-3">
  <div
    class="bg-background-secondary rounded-2xl p-8 flex flex-wrap justify-around items-center gap-8"
  >
    <!-- Icon -->
    @for (feature of features; track $index) {
    <feature-component
      [head]="feature.head"
      [text]="feature.text"
      [icon]="feature.icon"
    />
    }
  </div>
</section>
