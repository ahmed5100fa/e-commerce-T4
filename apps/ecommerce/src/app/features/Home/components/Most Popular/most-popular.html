<section>
  <!-- Head -->
  <div
    class="flex gap-y-5 flex-col sm:flex-row sm:gap-0 sm:justify-between items-center mb-4"
  >
    <!-- Most -->
    <app-second-header [text]="'Most Popular'" />
    <!-- Links -->
    <ul class="flex gap-x-4">
      <li class="text-zinc-700">Wedding</li>
      <li class="text-[#A6252A] font-semibold">Anniversary</li>
      <li class="text-zinc-700">Birthday</li>
      <li class="text-zinc-700">Engagement</li>
    </ul>
  </div>
  <!-- Proudcts -->

  <div class="grid grid-cols-12 gap-5">
    @for (proudct of proudctsList; track $index) {
    <div class="col-span-12 sm:col-span-6 lg:col-span-4">
      <app-card [product]="proudct"></app-card>
    </div>
    }
  </div>

  <!-- view more button -->
  <p></p>
</section>
