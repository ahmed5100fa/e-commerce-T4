<div class="space-y-6">
  <header class="space-y-1 text-center">
    <h1 class="text-xl font-semibold tracking-tight">Login</h1>
    <p class="text-sm text-slate-400">
      Enter your email and password to continue.
    </p>
  </header>

  <div class="flex justify-center">
  
  </div>

  <form class="space-y-4">
    <div class="space-y-1 text-left">
      <label class="block text-sm font-medium text-slate-200">Email</label>
      <input
        type="email"
        class="w-full rounded-lg border border-slate-700 bg-slate-900/70 px-3 py-2 text-sm text-slate-100
               placeholder:text-slate-500 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
        placeholder="you@example.com"
      />
    </div>

    <div class="space-y-1 text-left">
      <label class="block text-sm font-medium text-slate-200">Password</label>
      <input
        type="password"
        class="w-full rounded-lg border border-slate-700 bg-slate-900/70 px-3 py-2 text-sm text-slate-100
               placeholder:text-slate-500 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
        placeholder="••••••••"
      />
    </div>

    <button
      type="submit"
      class="inline-flex w-full items-center justify-center rounded-lg bg-indigo-500 px-4 py-2.5 text-sm font-medium
             text-white shadow-sm transition hover:bg-indigo-600 focus-visible:outline-none focus-visible:ring-2
             focus-visible:ring-indigo-500 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-950"
    >
      Sign in
    </button>
  </form>
</div>
