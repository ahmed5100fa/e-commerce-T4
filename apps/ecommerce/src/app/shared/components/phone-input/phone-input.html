<!-- phone -->
<div class="mb-3">
  <label class="form-label font-medium">Phone</label>

  <div
    class="flex items-center gap-2 border border-gray-300 rounded-md px-3 py-2  bg-white"
  >
    <!-- country -->
    <div class="flex items-center gap-1 text-gray-600 text-sm">
      <img
        src="https://flagcdn.com/w20/eg.png"
        alt="EG"
        class="w-5 h-auto"
      />
      <span>+20</span>
    </div>

    <!-- input -->
    <input
      type="text"
      class="flex-1 border-none outline-none text-sm text-gray-700 placeholder-gray-400"
      placeholder="1012345678"
      formControlName="phone"
    />
  </div>
</div>
